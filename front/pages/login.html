<section class="login-container">
    <div class="login-box">
        <img src="assets/images/logo.png" alt="Logo" class="login-logo">
        <h2>Finanças Pessoais</h2>
        <p class="login-subtitulo">Digite a senha para acessar</p>
        <form id="form-login">
            <div class="grupo-form">
                <input
                    type="password"
                    id="login-senha"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >
            </div>
            <p id="login-erro" class="login-erro" style="display:none;">Senha incorreta. Tente novamente.</p>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</section>
